name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint and test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies from lockfile
        run: uv sync --locked --extra rl

      - name: Ruff lint
        run: uv run ruff check src scripts tests

      - name: Ruff format check
        run: uv run ruff format --check src scripts tests

      - name: Pytest
        run: uv run pytest -q

  ui:
    name: Test (chat UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Node test runner
        run: node --test tests/chat_ui.test.cjs
